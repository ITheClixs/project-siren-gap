[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sirengap"
version = "0.0.1"
description = "Weight-space perception gap: symmetry, basins, and the limits of reading semantics from INR parameters"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "torch>=2.5",
    "numpy>=2.0",
    "scipy>=1.14",
    "einops>=0.8",
    "safetensors>=0.4",
    "pandas>=2.2",
    "pyarrow>=17",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
